name: Build Android APK (Stable Diffusion 1.5 On-Device)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK & NDK r26c
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - name: Install Vulkan Host Tools (glslc / shaderc)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew || true

      - name: Assemble Debug APK with Native stable-diffusion.cpp
        run: |
          cd android
          # If gradlew wrapper is not checked in, generate wrapper using gradle or run directly
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.2.1
            chmod +x gradlew
          fi
          ./gradlew assembleDebug --stacktrace -Pandroid.injected.build.model.only=false

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaVideoStudioAI-RedmiNote14-SD15-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
